name: Build and Push to ECR

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  FRONTEND_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY || 'fargate-ecs-app-frontend' }}
  BACKEND_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY || 'fargate-ecs-app-backend' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repositories if missing
        run: |
          aws ecr describe-repositories --repository-names ${{ env.FRONTEND_REPOSITORY }} >/dev/null 2>&1 || aws ecr create-repository --repository-name ${{ env.FRONTEND_REPOSITORY }} >/dev/null
          aws ecr describe-repositories --repository-names ${{ env.BACKEND_REPOSITORY }} >/dev/null 2>&1 || aws ecr create-repository --repository-name ${{ env.BACKEND_REPOSITORY }} >/dev/null

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build --platform linux/amd64 \
            --push \
            -t $ECR_REGISTRY/${{ env.FRONTEND_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/${{ env.FRONTEND_REPOSITORY }}:latest \
            ./frontend

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build --platform linux/amd64 \
            --push \
            -t $ECR_REGISTRY/${{ env.BACKEND_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/${{ env.BACKEND_REPOSITORY }}:latest \
            ./backend

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run basic validation checks
        run: |
          echo "Running tests for frontend and backend"
          test -f frontend/package.json
          test -f backend/requirements.txt

  deploy:
    needs: test
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Terraform init
        run: terraform init -input=false -backend=false

      - name: Terraform apply
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TF_VAR_database_password: ${{ secrets.DEV_DATABASE_PASSWORD }}
        run: |
          terraform apply -auto-approve -input=false -var-file=environments/development.tfvars \
            -var "frontend_image=$ECR_REGISTRY/${{ env.FRONTEND_REPOSITORY }}:latest" \
            -var "backend_image=$ECR_REGISTRY/${{ env.BACKEND_REPOSITORY }}:latest" \
            -var "database_password=${TF_VAR_database_password}"
